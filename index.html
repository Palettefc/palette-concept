<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Palette Concept - The Creative Agency for Social Impact</title>
  <!-- Font Awesome 圖標庫 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* 核心變數：暗色高科技與 CMYK 專屬色系 */
    :root {
      --bg-dark: #090d16;
      --card-bg: rgba(22, 27, 46, 0.65);
      --cmyk-cyan: #00aeef;
      --cmyk-magenta: #ec008c;
      --cmyk-yellow: #fff200;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-glow: rgba(0, 174, 239, 0.15);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* 頂部導覽列 (Glassmorphism 玻璃擬態) */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 45px;
      background: rgba(9, 13, 22, 0.85);
      backdrop-filter: blur(15px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .logo-container img {
      height: 46px;
      width: auto;
      display: block;
      transition: transform 0.3s ease;
    }

    .logo-container img:hover {
      transform: scale(1.03);
    }

    nav {
      display: flex;
      gap: 32px;
    }

    nav a {
      text-decoration: none;
      color: var(--text-muted);
      font-weight: 500;
      font-size: 0.98rem;
      transition: all 0.3s ease;
    }

    nav a:hover {
      color: var(--cmyk-cyan);
    }

    /* 主視覺 Hero 區塊 */
    .hero {
      position: relative;
      padding: 110px 20px 90px;
      text-align: center;
      background: radial-gradient(circle at 50% 20%, rgba(0, 174, 239, 0.15) 0%, rgba(236, 0, 140, 0.1) 45%, transparent 75%);
    }

    .hero h1 {
      font-size: 3.6rem;
      font-weight: 800;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #ffffff 0%, var(--cmyk-cyan) 50%, var(--cmyk-magenta) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 20px;
    }

    .hero p {
      font-size: 1.25rem;
      color: var(--text-muted);
      max-width: 720px;
      margin: 0 auto;
    }

    section {
      padding: 80px 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .section-title {
      text-align: center;
      margin-bottom: 50px;
    }

    .section-title h2 {
      font-size: 2.4rem;
      color: var(--text-main);
      letter-spacing: 1px;
    }

    .section-title p {
      color: var(--text-muted);
      margin-top: 8px;
    }

    /* 服務區塊卡片 */
    .services-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 30px;
    }

    .service-card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 35px;
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .service-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, var(--cmyk-cyan), var(--cmyk-magenta));
    }

    .service-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 10px 30px var(--accent-glow);
      border-color: rgba(0, 174, 239, 0.3);
    }

    .service-card h3 {
      font-size: 1.35rem;
      margin-bottom: 20px;
      color: #fff;
    }

    .service-card ul {
      list-style: none;
    }

    .service-card ul li {
      color: var(--text-muted);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .service-card ul li i {
      color: var(--cmyk-cyan);
    }

    /* 參考案例區塊 (6 個完整案例網格) */
    .portfolio-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(330px, 1fr));
      gap: 30px;
    }

    .portfolio-card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      overflow: hidden;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }

    .portfolio-card:hover {
      transform: translateY(-6px);
      border-color: rgba(236, 0, 140, 0.4);
      box-shadow: 0 12px 35px rgba(236, 0, 140, 0.15);
    }

    .card-media {
      position: relative;
      width: 100%;
      height: 220px;
      overflow: hidden;
    }

    .portfolio-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      cursor: zoom-in;
      transition: transform 0.5s ease;
    }

    .portfolio-card:hover .portfolio-img {
      transform: scale(1.08);
    }

    .card-tag {
      position: absolute;
      top: 15px;
      right: 15px;
      padding: 6px 14px;
      background: rgba(0, 174, 239, 0.85);
      backdrop-filter: blur(8px);
      color: #fff;
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .portfolio-content {
      padding: 24px;
    }

    .portfolio-content h3 {
      font-size: 1.25rem;
      color: #fff;
      margin-bottom: 10px;
    }

    .portfolio-content p {
      color: var(--text-muted);
      font-size: 0.92rem;
      margin-bottom: 15px;
    }

    .portfolio-meta {
      display: flex;
      gap: 15px;
      font-size: 0.85rem;
      color: #64748b;
    }

    /* Modal 全螢幕圖片燈箱 (Lightbox) */
    .modal {
      display: none;
      position: fixed;
      z-index: 9999;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(12px);
      justify-content: center;
      align-items: center;
      flex-direction: column;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .modal.show {
      display: flex;
      opacity: 1;
    }

    .modal-content {
      max-width: 90%;
      max-height: 80vh;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
      object-fit: contain;
      transform: scale(0.9);
      transition: transform 0.3s ease;
    }

    .modal.show .modal-content {
      transform: scale(1);
    }

    .modal-caption {
      margin-top: 18px;
      color: #e2e8f0;
      font-size: 1.05rem;
      text-align: center;
    }

    .modal-close {
      position: absolute;
      top: 25px;
      right: 35px;
      color: #fff;
      font-size: 40px;
      font-weight: bold;
